<svg width="100%" viewBox="0 0 680 620" role="img" xmlns="http://www.w3.org/2000/svg">
<title>AI Lead Scoring Engine — system architecture</title>
<desc>Lead flows from CRM or webhook through FastAPI validation, PostgreSQL, Redis retry queue, n8n AI orchestration, score write-back, and MCP endpoint for downstream agents.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #1a1a1a; }
    .th { font-size: 14px; font-weight: 600; }
    .ts { font-size: 12px; fill: #555; }
    .arr { stroke: #888; stroke-width: 1; fill: none; }
    .box-blue   { fill: #E6F1FB; stroke: #185FA5; }
    .box-teal   { fill: #E1F5EE; stroke: #0F6E56; }
    .box-amber  { fill: #FAEEDA; stroke: #854F0B; }
    .box-purple { fill: #EEEDFE; stroke: #534AB7; }
    .box-green  { fill: #EAF3DE; stroke: #3B6D11; }
    .box-gray   { fill: #F1EFE8; stroke: #5F5E5A; }
    .box-red    { fill: #FCEBEB; stroke: #A32D2D; }
    .txt-blue   { fill: #0C447C; }
    .txt-teal   { fill: #085041; }
    .txt-amber  { fill: #633806; }
    .txt-purple { fill: #3C3489; }
    .txt-green  { fill: #27500A; }
    .txt-gray   { fill: #444441; }
    .txt-red    { fill: #791F1F; }
    .sub-blue   { fill: #185FA5; font-size: 12px; }
    .sub-teal   { fill: #0F6E56; font-size: 12px; }
    .sub-amber  { fill: #854F0B; font-size: 12px; }
    .sub-purple { fill: #534AB7; font-size: 12px; }
    .sub-green  { fill: #3B6D11; font-size: 12px; }
    .sub-gray   { fill: #5F5E5A; font-size: 12px; }
    .sub-red    { fill: #A32D2D; font-size: 12px; }
  </style>
</defs>

<!-- Row 0: Entry points -->
<rect x="120" y="30" width="130" height="44" rx="8" stroke-width="0.5" class="box-gray"/>
<text class="th txt-gray" x="185" y="57" text-anchor="middle">CRM / web form</text>

<rect x="430" y="30" width="130" height="44" rx="8" stroke-width="0.5" class="box-gray"/>
<text class="th txt-gray" x="495" y="57" text-anchor="middle">Webhook / API call</text>

<line x1="185" y1="74" x2="185" y2="100" class="arr" marker-end="url(#arrow)"/>
<line x1="495" y1="74" x2="495" y2="100" class="arr" marker-end="url(#arrow)"/>
<line x1="185" y1="100" x2="495" y2="100" class="arr"/>
<line x1="340" y1="100" x2="340" y2="124" class="arr" marker-end="url(#arrow)"/>

<!-- Row 1: FastAPI -->
<rect x="200" y="124" width="280" height="56" rx="8" stroke-width="0.5" class="box-blue"/>
<text class="th txt-blue" x="340" y="147" text-anchor="middle">FastAPI gateway</text>
<text class="sub-blue" x="340" y="165" text-anchor="middle">Pydantic validation · auth · deduplication</text>

<line x1="480" y1="152" x2="560" y2="152" class="arr" marker-end="url(#arrow)"/>
<rect x="562" y="130" width="98" height="44" rx="8" stroke-width="0.5" class="box-red"/>
<text class="th txt-red" x="611" y="150" text-anchor="middle">Rejected</text>
<text class="sub-red" x="611" y="166" text-anchor="middle">400 / 409</text>

<line x1="340" y1="180" x2="340" y2="210" class="arr" marker-end="url(#arrow)"/>

<!-- Row 2: PostgreSQL -->
<rect x="200" y="210" width="280" height="56" rx="8" stroke-width="0.5" class="box-teal"/>
<text class="th txt-teal" x="340" y="233" text-anchor="middle">PostgreSQL</text>
<text class="sub-teal" x="340" y="251" text-anchor="middle">System of record · ACID · status = pending</text>

<line x1="340" y1="266" x2="340" y2="296" class="arr" marker-end="url(#arrow)"/>

<!-- Row 3: Redis -->
<rect x="200" y="296" width="280" height="56" rx="8" stroke-width="0.5" class="box-amber"/>
<text class="th txt-amber" x="340" y="319" text-anchor="middle">Redis retry queue</text>
<text class="sub-amber" x="340" y="337" text-anchor="middle">Exponential backoff + jitter · survives restarts</text>

<line x1="340" y1="352" x2="340" y2="382" class="arr" marker-end="url(#arrow)"/>

<!-- Row 4: n8n -->
<rect x="200" y="382" width="280" height="56" rx="8" stroke-width="0.5" class="box-purple"/>
<text class="th txt-purple" x="340" y="405" text-anchor="middle">n8n AI orchestration</text>
<text class="sub-purple" x="340" y="423" text-anchor="middle">Fetches lead · calls LLM · scores 1–10</text>

<!-- Score write-back loop -->
<path d="M480 410 L580 410 L580 238 L482 238" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="604" y="335" text-anchor="middle" transform="rotate(-90 604 335)">PATCH /leads/{id}/score</text>

<line x1="340" y1="438" x2="340" y2="468" class="arr" marker-end="url(#arrow)"/>

<!-- Row 5: MCP -->
<rect x="200" y="468" width="280" height="56" rx="8" stroke-width="0.5" class="box-green"/>
<text class="th txt-green" x="340" y="491" text-anchor="middle">MCP endpoint</text>
<text class="sub-green" x="340" y="509" text-anchor="middle">Exposes scores to downstream AI agents</text>

<line x1="340" y1="524" x2="340" y2="554" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="554" x2="205" y2="554" class="arr"/>
<line x1="340" y1="554" x2="475" y2="554" class="arr"/>

<!-- Row 6: Consumers -->
<rect x="130" y="554" width="150" height="44" rx="8" stroke-width="0.5" class="box-gray"/>
<text class="th txt-gray" x="205" y="572" text-anchor="middle">Sales dashboard</text>
<text class="sub-gray" x="205" y="588" text-anchor="middle">GET /leads/?min_score=7</text>

<rect x="400" y="554" width="150" height="44" rx="8" stroke-width="0.5" class="box-gray"/>
<text class="th txt-gray" x="475" y="572" text-anchor="middle">AI agent tool call</text>
<text class="sub-gray" x="475" y="588" text-anchor="middle">query_lead_score(id)</text>

<line x1="205" y1="554" x2="205" y2="554" marker-end="url(#arrow)" class="arr"/>
<line x1="475" y1="554" x2="475" y2="554" marker-end="url(#arrow)" class="arr"/>

</svg>
